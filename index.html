<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <meta name="description" content="¡Esto Es Todo Lo Que Tengo! - Professional HUD Interface">
  <title>¡Esto Es Todo Lo Que Tengo!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="hud">
    <header class="hud-header">
      <h1>¡ESTO ES TODO LO QUE TENGO!</h1>
      <div class="timestamp">Last Updated: <span id="current-time"></span></div>
    </header>

    <main class="hud-content">
      <section class="metrics-panel">
        <div class="metric">
          <h3>Audio Quality</h3>
          <div class="progress-bar">
            <div class="progress" style="width: 95%"></div>
          </div>
          <span class="value">95%</span>
        </div>

        <div class="metric">
          <h3>System Performance</h3>
          <div class="progress-bar">
            <div class="progress" style="width: 88%"></div>
          </div>
          <span class="value">88%</span>
        </div>

        <div class="metric">
          <h3>Resource Usage</h3>
          <div class="progress-bar">
            <div class="progress" style="width: 72%"></div>
          </div>
          <span class="value">72%</span>
        </div>
      </section>

      <section class="status-panel">
        <div class="status-item">
          <span class="label">Audio Status:</span>
          <span class="status active">Active</span>
        </div>
        <div class="status-item">
          <span class="label">Visualizer:</span>
          <span class="status active">Running</span>
        </div>
        <div class="status-item">
          <span class="label">System Health:</span>
          <span class="status good">Optimal</span>
        </div>
      </section>
    </main>

    <footer class="hud-footer">
      <div class="visualizer" id="visualizer"></div>
      <button id="play-button" class="play-button">Play Audio</button>
    </footer>
  </div>

  <audio id="track" loop>
    <source src="assets/¡Esto Es Todo Lo Que Tengo!!.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script src="script.js"></script>
</body>
</html>
